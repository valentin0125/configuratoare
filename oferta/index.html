<style>
:root {
  --bg: #f4f4f3; --card: #ffffff; --ink: #26262a; --muted: #5a5d69; --line: #e4e4e4; --line-strong: #c7c7c7;
  --bar: #26262a; --bar-ink: #ffffff; --cyan: #0097db; --ok: #1f7a4d; --bad: #b42318;
  --font: "Jost", system-ui, sans-serif; --font-data: "Gudea", "Jost", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-scheme="light"]) { --bg: #1a1a1d; --card: #33343b; --ink: #ffffff; --muted: #a9abb2; --line: rgba(255,255,255,.1); --line-strong: rgba(255,255,255,.22); --bar: #1a1a1d; }
}
:root[data-scheme="dark"] { --bg: #1a1a1d; --card: #33343b; --ink: #ffffff; --muted: #a9abb2; --line: rgba(255,255,255,.1); --line-strong: rgba(255,255,255,.22); --bar: #1a1a1d; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); }
.topbar { background: var(--bar); color: var(--bar-ink); border-bottom: 2px solid var(--cyan); }
.topbar-in { max-width: 760px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.wordmark-img { display: block; height: 20px; width: auto; }
.lang { margin-left: auto; display: flex; border: 1px solid rgba(255,255,255,.22); border-radius: 4px; overflow: hidden; }
.lang button { font: inherit; font-size: 12px; letter-spacing: .08em; background: none; color: #a9abb2; border: 0; padding: 4px 10px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: #ffffff; color: #26262a; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 16px; }
.eyebrow { margin: 0; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 2px 0 0; font-weight: 500; font-size: clamp(22px, 5vw, 30px); line-height: 1.2; overflow-wrap: anywhere; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
.card h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
dl { margin: 0; display: grid; grid-template-columns: minmax(110px, auto) 1fr; gap: 6px 16px; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; }
.svc { margin: 0; padding-left: 18px; }
.price { display: grid; gap: 4px; }
.price .row { display: flex; justify-content: space-between; gap: 12px; }
.price .net { font-family: var(--font-data); font-size: 26px; font-weight: 700; }
.num { font-family: var(--font-data); white-space: nowrap; }
.note { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.steps li { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.steps li::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line-strong); flex: none; }
.steps li.done { color: var(--ink); }
.steps li.done::before { background: var(--ink); border-color: var(--ink); }
.steps li.now { color: var(--ink); font-weight: 600; }
.steps li.now::before { background: var(--cyan); border-color: var(--cyan); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 4px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); font: inherit; font-weight: 500; text-decoration: none; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
form.find { display: flex; flex-wrap: wrap; gap: 10px; }
form.find input { flex: 1 1 200px; min-width: 0; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--card); color: var(--ink); font: inherit; text-transform: uppercase; }
.msg { margin: 0; }
.msg.bad { color: var(--bad); }
.foot { font-size: 12.5px; color: var(--muted); }
.foot a, a.addr { color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.skel { color: var(--muted); }
</style>
</head>

<script>
(function () {
  'use strict';
  // scriptul Google al fiecărui configurator, după prefixul ID-ului
  const SURSE = {
    B2C: 'https://script.google.com/macros/s/AKfycbxKSF_l1I7rCWU3PU3Sz6nUjQPtYUeaf2NUhQmz5Va4SkOgCqNS1i6NrAL8mDy1r-M/exec',
    ZK: 'https://script.google.com/macros/s/AKfycby5cfoqKTZzM_MaasYkrxgLj64Z4tlet8u0VnNnmxY3KGLA23zm-H6KU3w0AtXYoXc/exec',
    B2B: 'https://script.google.com/macros/s/AKfycbzFpd0yA5lQlaoLJfXjEjqBVPY7w3wTYNt5c7yraCsdoRH7mMRDpbNzxgAD5BxAhBc/exec'
  };
  const CONTACT = { email: 'hello@badsi.ro', telefon: '+40 722 384 008' };
  // statusurile din Cereri (vezi „Flux comandă configuratoare BADSI”), în ordine; „Refuzată” se arată separat
  const PASI = [
    ['Nouă', 'Cerere primită', 'Request received'],
    ['Contactat', 'Consultantul te-a contactat', 'Your consultant has contacted you'],
    ['Ofertă finală trimisă', 'Ofertă finală trimisă', 'Final offer sent'],
    ['Comandă', 'Comandă confirmată', 'Order confirmed'],
    ['Avans încasat', 'Avans încasat', 'Down payment received'],
    ['În producție / în transport', 'În producție / în transport', 'In production / in transit'],
    ['Omologare', 'Omologare și înmatriculare', 'Homologation and registration'],
    ['Livrată', 'Livrată', 'Delivered']
  ];
  const q = new URLSearchParams(location.search);
  let lang = q.get('lang') === 'en' ? 'en' : 'ro';
  let data = null, err = null;
  const L = (ro, en) => (lang === 'en' ? en : ro);
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const eur = n => (n == null ? '–' : new Intl.NumberFormat(lang === 'en' ? 'en-GB' : 'ro-RO', { maximumFractionDigits: 0 }).format(n) + ' €');
  const idOk = s => /^(B2C|ZK|B2B)-\d{1,7}$/.test(s);
  const formal = () => data && /^B2B-/.test(data.id);

  function findForm(msg, bad) {
    return '<div class="card"><h2>' + L('Caută oferta', 'Find your offer') + '</h2>'
      + (msg ? '<p class="msg' + (bad ? ' bad' : '') + '">' + esc(msg) + '</p>' : '')
      + '<form class="find" id="find"><label class="sr" for="fid" hidden>' + L('Numărul ofertei', 'Offer number') + '</label>'
      + '<input id="fid" name="id" placeholder="' + L('ex. ZK-12 sau B2C-15', 'e.g. ZK-12 or B2C-15') + '" autocomplete="off" aria-label="' + L('Numărul ofertei', 'Offer number') + '">'
      + '<button class="btn" type="submit">' + L('Deschide', 'Open') + '</button></form>'
      + '<p class="note">' + L('Numărul ofertei e în emailul cu oferta PDF și pe ecranul de după trimiterea cererii.', 'The offer number is in the email with your PDF offer and on the screen shown after you sent the request.') + '</p></div>';
  }

  function steps(status) {
    if (/refuz/i.test(status)) return '<p>' + L('Cererea a fost închisă.', 'This request has been closed.') + '</p>';
    let at = PASI.findIndex(p => p[0].toLowerCase() === String(status).toLowerCase());
    if (at < 0) at = 0;
    return '<ol class="steps">' + PASI.map((p, i) => '<li class="' + (i < at ? 'done' : i === at ? 'now' : '') + '"' + (i === at ? ' aria-current="step"' : '') + '>'
      + esc(i === 1 && formal() ? L('Consultantul v-a contactat', p[2]) : L(p[1], p[2])) + '</li>').join('') + '</ol>';
  }

  function render() {
    document.documentElement.lang = lang;
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    const main = $('main');
    if (!data) {
      document.title = L('Oferta BADSI', 'BADSI offer');
      main.innerHTML = '<div><p class="eyebrow">BADSI Automotive</p><h1>' + L('Oferta ta BADSI', 'Your BADSI offer') + '</h1></div>' + findForm(err, !!err);
      $('find').addEventListener('submit', e => {
        e.preventDefault();
        const v = $('fid').value.trim().toUpperCase().replace(/\s+/g, '');
        if (!idOk(v)) { err = L('Numărul arată ca ZK-12, B2C-15 sau B2B-3.', 'The number looks like ZK-12, B2C-15 or B2B-3.'); render(); return; }
        history.replaceState(null, '', '?id=' + encodeURIComponent(v) + (lang === 'en' ? '&lang=en' : ''));
        load(v);
      });
      return;
    }
    const d = data;
    const f = formal();
    document.title = L('Oferta BADSI ', 'BADSI offer ') + d.id;
    const stare = d.stare === 'nou' ? L('nouă', 'new') : d.stare === 'rulat' ? L('rulată', 'used') : d.stare;
    const svc = String(d.servicii || '').split(/,\s*/).filter(Boolean);
    const perCar = d.nrMasini ? L(' / mașină', ' / car') : '';
    main.innerHTML = '<div><p class="eyebrow">' + L('Oferta estimativă nr. ', 'Estimated offer no. ') + esc(d.id) + (d.data ? ' · ' + esc(d.data) : '') + '</p>'
      + '<h1>' + esc(d.masina || (d.tip === 'Altă mașină' ? L('Altă mașină – căutare la cerere', 'Another car – sourced on request') : L('Cerere BADSI', 'BADSI request'))) + '</h1></div>'
      + '<div class="card"><h2>' + L('Unde este cererea', 'Where your request is') + '</h2>' + steps(d.status) + '</div>'
      + (d.masina ? '<div class="card"><h2>' + L('Configurația', 'Configuration') + '</h2><dl>'
        + (stare ? '<dt>' + L('Stare', 'Condition') + '</dt><dd>' + esc(stare) + '</dd>' : '')
        + (d.nrMasini ? '<dt>' + L('Nr. mașini', 'Number of cars') + '</dt><dd>' + esc(d.nrMasini) + '</dd>' : '')
        + '<dt>' + L('Servicii BADSI', 'BADSI services') + '</dt><dd>' + (svc.length ? '<ul class="svc">' + svc.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul>' : L('niciunul', 'none')) + '</dd>'
        + '</dl></div>' : '')
      + (d.pretFaraTva ? '<div class="card"><h2>' + L('Preț estimativ', 'Estimated price') + '</h2><div class="price">'
        + (d.reducere ? '<div class="row"><span>' + L('Reducere B2B inclusă', 'B2B discount included') + perCar + '</span><span class="num">− ' + eur(d.reducere) + '</span></div>' : '')
        + '<div class="row"><span>' + L('Fără TVA', 'Excl. VAT') + perCar + '</span><span class="net">' + eur(d.pretFaraTva) + '</span></div>'
        + (d.pretCuTva ? '<div class="row"><span>' + L('Cu TVA', 'Incl. VAT') + perCar + '</span><span class="num">' + eur(d.pretCuTva) + '</span></div>' : '')
        + '</div><p class="note">' + (f ? L('Preț estimativ, livrat la sediul BADSI din București. Prețul final vă este confirmat de un consultant BADSI.', 'Estimated price, delivered to the BADSI headquarters in Bucharest. Your final price is confirmed by a BADSI consultant.')
          : L('Preț estimativ, livrat la sediul BADSI din București. Prețul final îți este confirmat de un consultant BADSI.', 'Estimated price, delivered to the BADSI headquarters in Bucharest. Your final price is confirmed by a BADSI consultant.')) + '</p></div>' : '')
      + '<div class="actions">' + (d.pdf ? '<a class="btn" href="' + esc(d.pdf) + '" target="_blank" rel="noopener">' + L('Deschide oferta PDF', 'Open the PDF offer') + ' ↗</a>' : '')
      + '<a class="btn ghost" href="mailto:' + CONTACT.email + '?subject=' + encodeURIComponent(L('Oferta ', 'Offer ') + d.id) + '">' + (f ? L('Scrieți-ne', 'Email us') : L('Scrie-ne', 'Email us')) + '</a>'
      + '<a class="btn ghost" href="tel:' + CONTACT.telefon.replace(/\s+/g, '') + '">' + esc(CONTACT.telefon) + '</a></div>'
      + '<p class="foot">BADSI Automotive · ' + esc(CONTACT.email) + ' · ' + esc(CONTACT.telefon) + '<br>'
      + L('Prețurile sunt estimative, fără obligații contractuale, și pot varia în funcție de cursul valutar și de disponibilitate.', 'Prices are estimates, non-binding, and may vary with the exchange rate and availability.') + '</p>';
  }

  async function load(id) {
    data = null; err = null;
    $('main').innerHTML = '<p class="skel">' + L('Se încarcă oferta…', 'Loading the offer…') + '</p>';
    try {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), 45000);   // scriptul Google răspunde uneori greu la primul apel
      const res = await fetch(SURSE[id.split('-')[0]] + '?oferta=' + encodeURIComponent(id), { signal: ctl.signal });
      clearTimeout(t);
      const r = await res.json();
      if (r && r.ok && r.id) data = r;   // fără id = scriptul nu e încă actualizat
      else err = r && r.error === 'negasita' ? L('Nu am găsit oferta ', 'We could not find offer ') + id + '.' : L('Oferta nu poate fi afișată acum. Încearcă din nou mai târziu.', 'The offer cannot be shown right now. Please try again later.');
    } catch (e) {
      err = L('Oferta nu poate fi afișată acum. Încearcă din nou mai târziu.', 'The offer cannot be shown right now. Please try again later.');
    }
    render();
  }

  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang;
    const u = new URL(location.href);
    if (lang === 'en') u.searchParams.set('lang', 'en'); else u.searchParams.delete('lang');
    history.replaceState(null, '', u);
    render();
  }));

  const id = String(q.get('id') || '').trim().toUpperCase();
  if (idOk(id)) load(id);
  else { if (id) err = L('Numărul ofertei nu e valid.', 'The offer number is not valid.'); render(); }
})();
</script>
</body>
</html>
