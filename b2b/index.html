<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Configurator BADSI Automotive pentru firme</title><meta name="description" content="Configurator BADSI Automotive pentru firme: alege ma&#537;ina &#537;i serviciile, vezi pre&#539;ul estimat &#537;i trimite cererea."><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<script>
/* tema și limba alese de vizitator (implicit: luminos, română), aplicate înainte de prima desenare */
(function () {
  var d = document.documentElement, t = null, l = null;
  try { t = localStorage.getItem('badsi-ui-theme'); l = localStorage.getItem('badsi-ui-lang'); } catch (e) { /* fără stocare locală */ }
  if (t === 'dark') d.setAttribute('data-scheme', 'dark');
  d.lang = l === 'en' ? 'en' : 'ro';
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Gudea:wght@400;700&display=swap">
<style>
/* Configurator B2B (doar firme care revând mașinile – reselleri; fără cont deocamdată): ca B2C, dar prețul mare e FĂRĂ TVA, cu reducerea B2B pe prețul mașinii, iar datele sunt ale firmei (CUI căutat la ANAF, firmă, funcție, nr. mașini). Persoanele fizice folosesc configuratorul B2C (link în pagină).
   Layout: bara neagră BADSI sus (ca pe badsi.ro: limba + tema în dreapta). Stânga: pașii clientului (mașina -> servicii -> datele lui); dreapta: panoul cu prețul, lipit. Pe telefon: o coloană + bară de preț jos.
   Paleta badsi.ro: fond crem #fdf8f4, carduri albe, text #212529, negru pentru acțiuni și preț. Luminos implicit; întunecat doar din butonul din bară (data-scheme="dark"). */
:root {
  --bg: #fdf8f4;
  --card: #ffffff;
  --ink: #212529;
  --muted: #6b6f75;
  --line: #e7e1db;
  --soft: #f8f4f0;
  --accent: #000000;
  --accent-ink: #ffffff;
  --panel: #ffffff;
  --panel-ink: #212529;
  --panel-muted: #6b6f75;
  --panel-line: #e7e1db;
  --panel-soft: #f8f4f0;
  --warn-ink: #8a4f08;
  --warn-bg: #fcf0dc;
  --err-ink: #a3261b;
  --err-bg: #fbe6e3;
  --ok: #1f7a4d;
  --ok-bg: #e2f3ea;
  --bar: #000000;
  --bar-ink: #ffffff;
  --bar-muted: #a9a9a9;
  --bar-edge: #3d3d3d;
  --bar-line: #000000;
  --shadow: 0 1px 2px rgba(33, 37, 41, .05), 0 6px 20px rgba(33, 37, 41, .05);
  --font-display: "Michroma", "Arial Black", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
:root[data-scheme="dark"] {
  --bg: #0b0c0e; --card: #15171a; --ink: #f2efeb; --muted: #9da0a6; --line: #2a2c30; --soft: #1d1f23;
  --accent: #ffffff; --accent-ink: #000000;
  --panel: #15171a; --panel-ink: #f2efeb; --panel-muted: #9da0a6; --panel-line: #2a2c30; --panel-soft: #1d1f23;
  --warn-ink: #f0b45a; --warn-bg: #2e2416; --err-ink: #ff9a8f; --err-bg: #34191a; --ok: #5cc196; --ok-bg: #15281f;
  --bar: #000000; --bar-ink: #ffffff; --bar-muted: #9a9a9a; --bar-edge: #3d3d3d; --bar-line: #26282c;
  --shadow: none;
  color-scheme: dark;
}

/* bara BADSI: limba (RO/EN) și tema (luminos/întunecat) */
.topbar { background: var(--bar); color: var(--bar-ink); border-bottom: 1px solid var(--bar-line); }
.topbar-in {
  max-width: 1200px; margin: 0 auto; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap;
}
.wordmark { font-family: var(--font-display); font-size: 16px; letter-spacing: .32em; margin-right: -.32em; }
.ui-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lang { display: inline-flex; border: 1px solid var(--bar-edge); border-radius: 999px; padding: 2px; }
.lang label { cursor: pointer; }
.lang input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.lang span { display: block; padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--bar-muted); }
.lang input:checked + span { background: var(--bar-ink); color: var(--bar); }
.lang input:focus-visible + span { outline: 2px solid var(--bar-ink); outline-offset: 2px; }
.theme-btn {
  display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 12px; font-weight: 700; color: var(--bar-ink);
  background: transparent; border: 1px solid var(--bar-edge); border-radius: 999px; padding: 5px 12px 5px 9px; cursor: pointer;
}
.theme-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.theme-btn .i-sun { display: none; }
:root[data-scheme="dark"] .theme-btn .i-sun { display: inline; }
:root[data-scheme="dark"] .theme-btn .i-moon { display: none; }
.theme-btn:hover { border-color: var(--bar-muted); }
.theme-btn:focus-visible { outline: 2px solid var(--bar-ink); outline-offset: 2px; }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.page {
  max-width: 1200px;
  margin: 0 auto;
  padding-block: 22px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 18px;
}

/* ---------- antet ---------- */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 24px; flex-wrap: wrap; }
.top > div:first-child { display: grid; gap: 6px; max-width: 64ch; min-width: 0; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-size: 22px; font-weight: 400; letter-spacing: .02em; text-wrap: balance; }
.intro { color: var(--muted); font-size: 13.5px; }
.contact { font-size: 12.5px; color: var(--muted); display: grid; gap: 2px; text-align: right; }
.contact b { color: var(--ink); font-family: var(--font-data); font-weight: 600; font-size: 13px; user-select: all; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 390px); gap: 20px; align-items: start; }
.steps { display: grid; gap: 16px; min-width: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; display: grid; gap: 16px; min-width: 0; box-shadow: var(--shadow); }
.step-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.step-no { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; font-family: var(--font-display); font-size: 11px; flex: none; }
h2 { font-size: 16px; font-weight: 800; letter-spacing: .005em; }
.step-head .hint { margin-left: auto; font-size: 12px; color: var(--muted); }
.group { display: grid; gap: 8px; min-width: 0; border: 0; padding: 0; margin: 0; }
.group > .lbl, .group > legend { font-size: 12px; font-weight: 700; color: var(--muted); padding: 0; margin-bottom: 0; }
.hint-text { font-size: 12.5px; color: var(--muted); max-width: 72ch; }

/* comutator (Din ofertă / Altă mașină, Nouă / Rulată) */
.seg { display: inline-flex; justify-self: start; width: fit-content; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; max-width: 100%; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; padding: 7px 16px; font-weight: 700; font-size: 13px; white-space: nowrap; }
.seg input:checked + span { background: var(--ink); color: var(--bg); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -3px; }
.seg input:disabled + span { opacity: .4; cursor: not-allowed; }

/* modele */
.models { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.opt { position: relative; display: block; cursor: pointer; min-width: 0; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .box { display: grid; gap: 4px; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); height: 100%; }
.opt:hover .box { border-color: var(--muted); }
.opt input:checked + .box { border-color: var(--ink); background: var(--soft); box-shadow: inset 0 0 0 1px var(--ink); }
.opt input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
.model-name { font-family: var(--font-display); font-size: 15px; letter-spacing: .02em; }
.model-from { font-size: 12.5px; color: var(--muted); }
.model-from b { color: var(--ink); font-family: var(--font-data); font-weight: 600; }

/* versiuni */
.versions { display: grid; gap: 8px; }
.ver .box { grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 14px; padding: 12px 16px; }
.ver-name { font-weight: 800; font-size: 14.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ver-meta { font-size: 12.5px; color: var(--muted); grid-column: 1; }
.ver-price { grid-row: 1 / span 2; grid-column: 2; text-align: right; font-family: var(--font-data); font-weight: 600; font-size: 14px; white-space: nowrap; }
.ver-price small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 11px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--warn-bg); color: var(--warn-ink); }

/* servicii */
.svc { display: grid; gap: 6px; }
.svc-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.svc-row:has(input:checked) { border-color: var(--ink); background: var(--soft); }
.svc-row input { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--ink); }
.svc-name { font-weight: 700; font-size: 13.5px; }
.svc-desc { grid-column: 2; font-size: 12px; color: var(--muted); }
.svc-price { grid-row: 1; grid-column: 3; font-family: var(--font-data); font-size: 12.5px; white-space: nowrap; }

/* formular */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 700; color: var(--muted); }
.field small { font-size: 11.5px; color: var(--muted); }
input[type="text"], input[type="number"], input[type="tel"], input[type="email"], input[type="url"], textarea {
  width: 100%; min-width: 0; font: inherit; color: var(--ink); background: var(--soft);
  border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px;
}
textarea { resize: vertical; min-height: 74px; }
.field.is-bad input, .field.is-bad textarea { border-color: var(--err-ink); }
.field .err { color: var(--err-ink); font-size: 11.5px; }
input:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.agree { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; cursor: pointer; }
.agree input { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--ink); flex: none; }
.agree.is-bad { color: var(--err-ink); }
.trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-weight: 700;
  padding: 10px 18px; border-radius: 999px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn:hover { background: transparent; color: var(--ink); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.ghost:hover { background: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.msg { font-size: 13px; color: var(--muted); min-width: 0; }
.msg.is-error { color: var(--err-ink); }

.done { display: grid; gap: 10px; padding: 16px 18px; border-radius: 12px; background: var(--ok-bg); color: var(--ok); }
.done b { font-size: 15px; }
.done p { color: var(--ink); }
.manual-send { display: grid; gap: 12px; padding: 16px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--soft); }
.manual-send .addr { font-family: var(--font-data); font-weight: 600; user-select: all; }

/* ---------- panoul de preț ---------- */
.panel {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 14px);
  background: var(--panel); color: var(--panel-ink); border: 1px solid var(--panel-line); border-radius: 14px; padding: 20px 20px 18px;
  display: grid; gap: 14px; min-width: 0; box-shadow: var(--shadow);
}
.panel h2 { font-family: var(--font-display); font-weight: 400; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.panel .sub { font-size: 13px; color: var(--panel-ink); font-weight: 700; margin-top: 4px; }
.panel .sub span { display: block; font-weight: 500; font-size: 12px; color: var(--panel-muted); }
.blk { display: grid; gap: 5px; padding-top: 12px; border-top: 1px solid var(--panel-line); }
.ln { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; min-width: 0; }
.ln > :first-child { min-width: 0; }
.ln .v { font-family: var(--font-data); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ln .d { color: var(--panel-muted); font-size: 11.5px; display: block; }
.big { display: grid; gap: 2px; padding: 14px 14px 12px; border-radius: 11px; background: var(--panel-soft); }
.big span { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--panel-muted); }
.big b { font-family: var(--font-display); font-weight: 400; font-size: 24px; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.big b .cur { font-family: var(--font-body); font-weight: 700; margin-right: .2em; }   /* Michroma desenează € ca pe un O */
.big small { font-size: 12.5px; color: var(--panel-muted); font-family: var(--font-data); }
.big.wait b { font-family: var(--font-body); font-weight: 800; font-size: 18px; }
.notes { display: grid; gap: 6px; font-size: 12px; color: var(--panel-muted); }
.panel .warn { font-size: 12.5px; padding: 9px 11px; border-radius: 9px; background: var(--warn-bg); color: var(--warn-ink); }
.panel .btn { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); width: 100%; }
.panel .btn:hover { background: transparent; color: var(--panel-ink); }
.foot { font-size: 11.5px; color: var(--muted); max-width: 90ch; }

/* bara de preț pe telefon */
.mbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--panel); color: var(--panel-ink);
  border-top: 1px solid var(--panel-line); box-shadow: 0 -6px 20px rgba(0, 0, 0, .08);
  padding-top: 10px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: none; align-items: center; justify-content: space-between; gap: 12px;
}
.mbar span { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--panel-muted); }
.mbar b { font-family: var(--font-data); font-size: 16px; font-weight: 600; }
.mbar .btn { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding: 8px 14px; }

@media (max-width: 940px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; }
  .mbar { display: flex; }
  .page { padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
  .contact { text-align: left; }
}
@media (max-width: 600px) {
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .card { padding: 16px; }
  h1 { font-size: 18px; }
  .ver .box { grid-template-columns: minmax(0, 1fr); }
  .ver-price { grid-row: auto; grid-column: 1; text-align: left; }
  .ver-price small { display: inline; margin-left: 6px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
/* oferta PDF: se deseneaza in afara ecranului, mereu pe alb (si in tema intunecata), apoi devine PDF A4 */
#pdf-root { position: fixed; left: -12000px; top: 0; width: 720px; pointer-events: none; }
.pdf-blk { width: 720px; background: #fff; color: #212529; font-family: Manrope, system-ui, sans-serif; font-size: 12px; line-height: 1.45; padding: 0 0 10px; }
.pdf-blk * { box-sizing: border-box; }
.pdf-band { display: flex; justify-content: space-between; align-items: center; background: #000; color: #fff; padding: 14px 18px; }
.pdf-logo { font-family: Michroma, Manrope, sans-serif; font-size: 17px; letter-spacing: .12em; }
.pdf-band-r { text-align: right; font-size: 11px; line-height: 1.5; }
.pdf-band-r b { font-size: 13px; }
.pdf-title { font-family: Michroma, Manrope, sans-serif; font-size: 22px; font-weight: 400; letter-spacing: .04em; margin: 16px 0 2px; }
.pdf-sub { color: #6b6f75; font-size: 12.5px; margin: 0; }
.pdf-hero { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: #f4f1ee; }
.pdf-thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
.pdf-thumbs figure { margin: 0; }
.pdf-thumbs img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; background: #f4f1ee; }
.pdf-thumbs figcaption, .pdf-cap { font-size: 10px; color: #6b6f75; margin: 3px 0 0; }
.pdf-h { font-size: 10.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; border-bottom: 2px solid #000; padding: 0 0 5px; margin: 6px 0 4px; }
.pdf-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.pdf-kv { display: grid; grid-template-columns: 120px 1fr; gap: 3px 10px; margin: 0; }
.pdf-kv dt { color: #6b6f75; }
.pdf-kv dd { margin: 0; font-weight: 600; word-break: break-word; }
.pdf-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 7px 0; border-bottom: 1px solid #e7e1db; }
.pdf-row b { font-weight: 700; }
.pdf-row p { margin: 1px 0 0; color: #6b6f75; font-size: 11px; }
.pdf-row .pdf-amt { font-weight: 700; white-space: nowrap; text-align: right; }
.pdf-tot { width: 100%; border-collapse: collapse; }
.pdf-tot td { padding: 6px 0; border-bottom: 1px solid #e7e1db; }
.pdf-tot td:last-child { text-align: right; font-weight: 700; white-space: nowrap; }
.pdf-tot .pdf-net td { border-top: 2px solid #000; border-bottom: 0; font-size: 15px; font-weight: 800; padding-top: 9px; }
.pdf-tot .pdf-small td { color: #6b6f75; font-size: 11.5px; }
.pdf-tot .pdf-gross td { font-size: 13px; font-weight: 700; border-bottom: 0; }
.pdf-notes p { margin: 0 0 5px; color: #4b4f55; font-size: 11px; }
.pdf-msg { white-space: pre-wrap; margin: 0; }



/* ==== BADSI DESIGN SYSTEM (din 11.11.2026; sursa: artefactul „Badsi Design System Default”) ====
   Suprascrie paleta veche (crem badsi.ro, Manrope/Michroma): gri închis #26262A, gri deschis #C7C7C7, alb, cyan #0097DB doar ca accent
   (linia de sub bară, focus), fonturi Jost (titluri + text) și Gudea (cifre), colțuri 4 px la butoane/câmpuri și 8 px la carduri.
   Garanții pe culori (clasa pachetului): PLATINUM = gri închis, GOLD = nude #D2B295, SILVER = gri deschis, Fără garanție = contur. */
:root {
  --bg: #ffffff; --card: #ffffff; --ink: #26262a; --muted: #5a5d69; --line: #e4e4e4; --line-strong: #c7c7c7; --soft: #f4f4f3;
  --sel: #26262a; --accent: #26262a; --accent-ink: #ffffff;
  --panel: #ffffff; --panel-ink: #26262a; --panel-muted: #5a5d69; --panel-line: #e4e4e4; --panel-soft: #f4f4f3;
  --bar: #26262a; --bar-ink: #ffffff; --bar-muted: #a9abb2; --bar-edge: rgba(255, 255, 255, .22); --bar-line: #0097db;
  --cyan: #0097db;
  --shadow: 0 1px 2px rgba(38, 38, 42, .06);
  --font-display: "Jost", system-ui, sans-serif;
  --font-body: "Jost", system-ui, sans-serif;
  --font-data: "Gudea", "Jost", system-ui, sans-serif;
  --t-platinum: #26262a; --t-platinum-ink: #ffffff; --t-platinum-soft: #ececed;
  --t-gold: #d2b295; --t-gold-ink: #26262a; --t-gold-soft: #f7f0e9;
  --t-silver: #c7c7c7; --t-silver-ink: #26262a; --t-silver-soft: #f4f4f3;
}
:root[data-scheme="dark"] {
  --bg: #26262a; --card: #33343b; --ink: #ffffff; --muted: #a9abb2; --line: rgba(255, 255, 255, .1); --line-strong: rgba(255, 255, 255, .22); --soft: #1a1a1d;
  --sel: #ffffff; --accent: #ffffff; --accent-ink: #26262a;
  --panel: #33343b; --panel-ink: #ffffff; --panel-muted: #a9abb2; --panel-line: rgba(255, 255, 255, .1); --panel-soft: #1a1a1d;
  --bar: #1a1a1d; --bar-ink: #ffffff; --bar-muted: #a9abb2; --bar-edge: rgba(255, 255, 255, .22);
  --shadow: none;
  --t-platinum: #ffffff; --t-platinum-ink: #26262a; --t-platinum-soft: #40434e;
  --t-gold-soft: #3d362f; --t-silver-soft: #2c2d31;
}
body { font-family: var(--font-body); }
.topbar { border-bottom: 2px solid var(--cyan) !important; }
.wordmark-img { display: block; height: 20px; width: auto; }
h1, .model-name, .stage-model, .panel h2 { font-family: var(--font-display); font-weight: 500; letter-spacing: 0; }
.big b { font-family: var(--font-display); font-weight: 500; }
:focus-visible { outline-color: var(--cyan) !important; }
/* colțuri: 8 px carduri, 4 px butoane și câmpuri (pastilele rămân doar la insigne) */
.card, .panel, .ded, .done, .manual-send, .offer-box, .big { border-radius: 8px; }
.btn, .seg, .lang, .lang span, .theme-btn, .opt .box, .svc-row, .warn, .chip,
input[type="text"], input[type="tel"], input[type="email"], input[type="url"], input[type="number"], textarea, select { border-radius: 4px; }
.seg span { border-radius: 0; }
/* garanții: insigna pachetului în culoarea clasei + rând/buton mai mic */
.svc-row:has(input[value^="w-"]) { padding: 7px 10px; }
.svc-row:has(input[value^="w-"]) .svc-name,
.pick:has(input[value^="w-"]) .seg-body b,
.tier { display: inline-block; justify-self: start; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .1em; line-height: 1.6; border: 1px solid var(--line-strong); }
.svc-row:not(.svc-warranty):has(input[value="w-service"]) .svc-name, .pick:has(input[value="w-service"]) .seg-body b, .tier.t-platinum { background: var(--t-platinum); color: var(--t-platinum-ink); border-color: var(--t-platinum); }
.svc-row:not(.svc-warranty):has(input[value="w-concierge"]) .svc-name, .pick:has(input[value="w-concierge"]) .seg-body b, .tier.t-gold { background: var(--t-gold); color: var(--t-gold-ink); border-color: var(--t-gold); }
.svc-row:not(.svc-warranty):has(input[value="w-base"]) .svc-name, .pick:has(input[value="w-base"]) .seg-body b, .tier.t-silver { background: var(--t-silver); color: var(--t-silver-ink); border-color: var(--t-silver); }
.svc-row:not(.svc-warranty):has(input[value="w-service"]:checked) { background: var(--t-platinum-soft); border-color: var(--t-platinum); }
.svc-row:not(.svc-warranty):has(input[value="w-concierge"]:checked) { background: var(--t-gold-soft); border-color: var(--t-gold); }
.svc-row:not(.svc-warranty):has(input[value="w-base"]:checked) { background: var(--t-silver-soft); border-color: var(--t-silver); }
.pick input[value="w-service"]:checked + .pick-body { background: var(--t-platinum-soft); }
.pick input[value="w-concierge"]:checked + .pick-body { background: var(--t-gold-soft); box-shadow: inset 0 0 0 1px var(--t-gold); border-color: var(--t-gold); }
.pick input[value="w-base"]:checked + .pick-body { background: var(--t-silver-soft); }
.svc-warranty .seg { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.svc-warranty .seg-body { padding: 7px 4px; gap: 4px; justify-items: center; }
.svc-warranty .seg-body b { font-size: 10.5px; }
.svc-warranty .seg-body small { font-size: 11px; }
@media (max-width: 420px) { .svc-warranty .seg { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
/* butoane de informații (i): vezi info.js */
.info { position: relative; display: inline-grid; place-items: center; width: 18px; height: 18px; padding: 0; margin: 0 0 0 5px; border: 1px solid var(--line-strong); border-radius: 50%; background: var(--card); color: var(--muted); cursor: help; vertical-align: -3px; flex: none; font: inherit; line-height: 1; }
.info::after { content: ""; position: absolute; inset: -9px; }
.info svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
.info:hover, .info[aria-expanded="true"] { color: #ffffff; background: var(--cyan); border-color: var(--cyan); }
.tip-pop { position: fixed; z-index: 80; max-width: 320px; padding: 10px 12px; border-radius: 4px; background: #26262a; color: #ffffff; font-family: var(--font-body); font-size: 12.5px; font-weight: 400; line-height: 1.5; letter-spacing: 0; text-transform: none; text-align: left; white-space: pre-line; box-shadow: 0 8px 24px rgba(38, 38, 42, .2); pointer-events: none; }
:root[data-scheme="dark"] .tip-pop { background: #ffffff; color: #26262a; }
.svc-name .info, .seg-body b .info { vertical-align: -4px; }
/* PDF: bandă gri închis cu logo-ul oficial, fonturile sistemului */
.pdf-blk { font-family: Jost, system-ui, sans-serif !important; }
.pdf-band { background: #26262a !important; border-bottom: 3px solid #0097db; }
img.pdf-logo { display: block; height: 22px; width: auto; }
.pdf-title { font-family: Jost, system-ui, sans-serif !important; font-weight: 500 !important; }
.pdf-tier { display: inline-block; padding: 0 7px; border-radius: 9px; font-size: 10px; font-weight: 700; letter-spacing: .08em; margin-left: 6px; vertical-align: 1px; }
.pdf-tier.t-platinum { background: #26262a; color: #fff; } .pdf-tier.t-gold { background: #d2b295; color: #26262a; } .pdf-tier.t-silver { background: #c7c7c7; color: #26262a; }
/* ==== /BADSI DESIGN SYSTEM ==== */
</style>
<script>
/* ==== BADSI INFO (i) (din 11.11.2026) ====
   Butoane de informații: textul stă în data-tip. Pe calculator apare la trecerea mouse-ului și la focus (Tab);
   pe telefon apare la atingere. Clic/atingere pe același buton sau în afară și Esc îl închid.
   Paginile pun butonul cu window.tipBtn(text) (sau direct <button class="info" data-tip="…">). */
(function () {
  'use strict';
  var SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 11v6M12 7.6v.2"/></svg>';
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  window.tipBtn = function (text, label) {
    if (!text) return '';
    var en = document.documentElement.lang === 'en';
    return '<button type="button" class="info" data-tip="' + esc(text) + '" aria-label="' + esc(label || (en ? 'More information' : 'Detalii')) + '" aria-expanded="false">' + SVG + '</button>';
  };
  var pop = null, cur = null, pinned = false;
  function ensure() {
    if (pop) return pop;
    pop = document.createElement('div');
    pop.className = 'tip-pop'; pop.id = 'tip-pop'; pop.setAttribute('role', 'tooltip'); pop.hidden = true;
    document.body.appendChild(pop);
    return pop;
  }
  function place(b) {
    var r = b.getBoundingClientRect();
    pop.style.maxWidth = Math.min(320, innerWidth - 24) + 'px';
    pop.style.left = '0px'; pop.style.top = '0px';
    var p = pop.getBoundingClientRect();
    var x = Math.max(12, Math.min(r.left + r.width / 2 - p.width / 2, innerWidth - p.width - 12));
    var y = r.bottom + 8;
    if (y + p.height > innerHeight - 12) y = r.top - p.height - 8;
    pop.style.left = x + 'px'; pop.style.top = Math.max(8, y) + 'px';
  }
  function show(b, pin) {
    ensure();
    if (cur && cur !== b) cur.setAttribute('aria-expanded', 'false');
    cur = b; pinned = !!pin;
    pop.textContent = b.getAttribute('data-tip');
    pop.hidden = false;
    b.setAttribute('aria-expanded', 'true'); b.setAttribute('aria-describedby', 'tip-pop');
    place(b);
  }
  function hide() {
    if (!cur) return;
    cur.setAttribute('aria-expanded', 'false'); cur.removeAttribute('aria-describedby');
    cur = null; pinned = false; pop.hidden = true;
  }
  var btnOf = function (t) { return t && t.closest ? t.closest('.info[data-tip]') : null; };
  var fine = window.matchMedia ? matchMedia('(hover: hover) and (pointer: fine)') : { matches: true };
  document.addEventListener('mouseover', function (e) { var b = btnOf(e.target); if (b && fine.matches && !pinned) show(b); });
  document.addEventListener('mouseout', function (e) { var b = btnOf(e.target); if (b && b === cur && fine.matches && !pinned && !b.contains(e.relatedTarget)) hide(); });
  document.addEventListener('focusin', function (e) { var b = btnOf(e.target); if (b) { if (b !== cur) show(b); } else if (cur && !pinned) hide(); });
  // capturare: butonul (i) dintr-o etichetă nu bifează/debifează opțiunea
  document.addEventListener('click', function (e) {
    var b = btnOf(e.target);
    if (b) { e.preventDefault(); e.stopPropagation(); if (cur === b && pinned) hide(); else show(b, true); return; }
    if (cur && !(pop && pop.contains(e.target))) hide();
  }, true);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && cur) { var b = cur; hide(); b.focus(); } });
  // la derulare bula urmează butonul; dacă butonul iese din ecran (sau dispare), bula se închide
  addEventListener('scroll', function () {
    if (!cur) return;
    var r = cur.getBoundingClientRect();
    if (!cur.isConnected || r.bottom < 0 || r.top > innerHeight) hide(); else place(cur);
  }, true);
  addEventListener('resize', function () { if (cur) place(cur); });
})();
/* ==== /BADSI INFO ==== */
</script>

<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow" id="t-eticheta"></p>
      <h1 id="t-titlu"></h1>
      <p class="intro" id="t-intro"></p>
    </div>
    <div class="contact" id="contact"></div>
  </header>

  <div class="layout">
    <div class="steps">

      <!-- 1. masina -->
      <section class="card" aria-labelledby="h-car">
        <div class="step-head"><span class="step-no">1</span><h2 id="h-car" data-en="The car">Mașina</h2></div>
        <div class="seg" role="radiogroup" aria-label="Ce mașină cauți" data-en-aria="Which car are you looking for">
          <label><input type="radio" name="mode" value="catalog" id="mode-catalog" checked><span data-en="From our offer">Din oferta noastră</span></label>
          <label><input type="radio" name="mode" value="other" id="mode-other"><span data-en="Another car">Altă mașină</span></label>
        </div>

        <div id="catalog" class="steps">
          <div class="group" role="radiogroup" aria-labelledby="l-model">
            <span class="lbl" id="l-model">Model</span>
            <div class="models" id="models"></div>
          </div>
          <div class="group">
            <span class="lbl"><span id="l-stare" data-en="Condition">Stare</span><span id="tip-stare"></span></span>
            <div class="seg" role="radiogroup" aria-labelledby="l-stare">
              <label><input type="radio" name="stare" value="nou" id="stare-nou" checked><span data-en="New">Nouă</span></label>
              <label><input type="radio" name="stare" value="rulat" id="stare-rulat"><span data-en="Used">Rulată</span></label>
            </div>
            <p class="hint-text stare-note" id="stare-note" hidden></p>
          </div>
          <div class="group" role="radiogroup" aria-labelledby="l-ver">
            <span class="lbl" id="l-ver" data-en="Version">Versiune</span>
            <div class="versions" id="versions"></div>
          </div>
        </div>

        <div id="other" class="steps" hidden>
          <p class="hint-text" id="t-alta"></p>
          <label class="field" id="fw-desc"><span data-en="Which car are you looking for">Ce mașină cauți</span>
            <textarea id="o-desc" rows="3" maxlength="2000" placeholder="ex.: Xiaomi SU7 Max, 2025, alb, sub 20.000 km, buget în jur de 60.000 €" data-en-ph="e.g. Xiaomi SU7 Max, 2025, white, under 20,000 km, budget around €60,000"></textarea>
            <small class="err" id="e-desc" hidden data-en="Write a few words about the car you are looking for.">Scrieți câteva cuvinte despre mașina pe care o căutați.</small>
          </label>
          <label class="field"><span data-en="Link to a listing (optional)">Link către un anunț (opțional)</span>
            <input type="url" id="o-link" maxlength="500" inputmode="url" placeholder="https://…">
          </label>
        </div>
      </section>

      <!-- 2. servicii -->
      <section class="card" id="s-svc" aria-labelledby="h-svc">
        <div class="step-head"><span class="step-no">2</span><h2 id="h-svc" data-en="BADSI services">Servicii BADSI</h2><span class="hint" data-en="Prices excl. VAT">Prețuri fără TVA</span></div>
        <fieldset class="group" id="g-war">
          <legend><span data-en="BADSI warranty package">Pachet de garanție BADSI</span><span id="tip-war"></span></legend>
          <div class="svc" id="svc-war"></div>
        </fieldset>
        <div class="group">
          <span class="lbl" data-en="Other services">Alte servicii</span>
          <div class="svc" id="svc-other"></div>
        </div>
      </section>

      <!-- 3. datele clientului -->
      <section class="card" id="s-date" aria-labelledby="h-date">
        <div class="step-head"><span class="step-no" id="no-date">3</span><h2 id="h-date" data-en="Your details">Datele dumneavoastră</h2></div>
        <form id="form" novalidate class="steps">
          <p class="hint-text" id="t-pf"></p>
          <div class="grid2" id="pj-box">
            <label class="field" id="fw-cui"><span>CUI</span>
              <input type="text" id="f-cui" inputmode="numeric" maxlength="14" placeholder="ex.: RO12345678" data-en-ph="e.g. RO12345678" autocomplete="off">
              <small class="err" id="e-cui" hidden data-en="Write a valid tax ID (CUI).">Scrieți un CUI valid.</small>
              <small id="anaf-msg" aria-live="polite"></small>
            </label>
            <label class="field" id="fw-firma"><span data-en="Company name">Firma</span>
              <input type="text" id="f-firma" autocomplete="organization" maxlength="200">
              <small class="err" id="e-firma" hidden data-en="Write the company name.">Scrieți numele firmei.</small>
            </label>
            <label class="field"><span data-en="Job title (optional)">Funcție (opțional)</span>
              <input type="text" id="f-functie" autocomplete="organization-title" maxlength="120" placeholder="ex.: administrator, manager flotă" data-en-ph="e.g. director, fleet manager">
            </label>
            <label class="field" id="fw-nr"><span data-en="Number of cars">Număr de mașini</span>
              <input type="number" id="f-nr" min="1" max="999" step="1" value="1" inputmode="numeric">
              <small class="err" id="e-nr" hidden data-en="Write a number between 1 and 999.">Scrieți un număr între 1 și 999.</small>
            </label>
          </div>
          <div class="grid2">
            <label class="field" id="fw-nume"><span id="l-nume" data-en="Contact person">Persoană de contact</span>
              <input type="text" id="f-nume" autocomplete="name" maxlength="120" required>
              <small class="err" id="e-nume" hidden data-en="Write your name.">Scrieți numele.</small>
            </label>
            <label class="field" id="fw-tel"><span data-en="Phone">Telefon</span>
              <input type="tel" id="f-tel" autocomplete="tel" inputmode="tel" maxlength="40" placeholder="07xx xxx xxx" data-en-ph="+40 7xx xxx xxx" required>
              <small class="err" id="e-tel" hidden data-en="Write a valid phone number.">Scrieți un număr de telefon valid.</small>
            </label>
          </div>
          <label class="field" id="fw-email"><span>Email</span>
            <input type="email" id="f-email" autocomplete="email" maxlength="160" placeholder="nume@exemplu.ro" data-en-ph="name@example.com" required>
            <small class="err" id="e-email" hidden data-en="Write a valid email address.">Scrieți o adresă de email validă.</small>
          </label>
          <label class="field" id="fw-msg"><span data-en="Message (optional)">Mesaj (opțional)</span>
            <textarea id="f-msg" rows="2" maxlength="2000" placeholder="ex.: culoarea dorită, termenul de livrare dorit" data-en-ph="e.g. preferred colour, desired delivery date"></textarea>
          </label>
          <label class="agree" id="fw-gdpr"><input type="checkbox" id="f-gdpr" required><span id="t-gdpr"></span></label>
          <div class="trap" aria-hidden="true"><label>Website <input type="text" id="f-website" tabindex="-1" autocomplete="off"></label></div>
          <p class="msg" id="send-msg" aria-live="polite"></p>
        </form>
        <div class="done" id="done" hidden role="status"></div>
        <div class="manual-send" id="manual" hidden></div>
      </section>
    </div>

    <!-- pretul -->
    <aside class="panel" aria-labelledby="h-calc">
      <div>
        <h2 id="h-calc" data-en="Your estimate">Estimarea dumneavoastră</h2>
        <p class="sub" id="p-car"></p>
      </div>
      <div id="p-body"></div>
      <div class="notes" id="p-notes"></div>
      <button class="btn" type="button" id="btn-panel">Trimite cererea</button>
    </aside>
  </div>

  <p class="foot" id="foot"></p>
</div>

<div class="mbar" id="mbar" aria-hidden="true">

<script>
(function () {
  'use strict';

  /* =====================================================================
     ARHITECTURA (configurator B2B, public, fără cont deocamdată)
     1. Date        - blocul JSON de mai sus
     2. Utilitare   - formatare bani, text
     3. Calcul      - preț = mașina × (1 − reducere B2B) + servicii bifate; TVA peste (afișat mic).
                      Clienții B2B sunt doar firme (reselleri); persoanele fizice merg la configuratorul B2C.
     4. Interfață   - stare + randare (model -> stare -> versiune -> servicii)
     5. Trimitere   - POST JSON la adresa din „endpoint” (scriptul din Cereri B2B; tot el caută CUI-ul la ANAF);
                      după trimitere (reușită sau nu) clientul primește oferta PDF; dacă trimiterea nu merge, și emailul/telefonul BADSI. (Ulterior: cererea devine lead în Workleto CRM.)
     Pagina nu citește nimic din afară: merge la fel ca artefact și pe GitHub.
     ===================================================================== */

  // ---------- 1. date ----------
  const D = JSON.parse(document.getElementById('b2b-data').textContent);
  const SVC = D.servicii;
  const WAR = SVC.filter(s => s.tip === 'garanție');
  const OTHER = SVC.filter(s => s.tip !== 'garanție');
  const RED = Number(D.reducere) || 0;   // reducerea B2B, pe prețul mașinii (din Baza date configurator B2B / Parametri)

  // ---------- 2. utilitare ----------
  const $ = id => document.getElementById(id);

  // limba (RO/EN): textele fixe au varianta engleză în data-en / data-en-ph / data-en-aria; cele generate folosesc L(ro, en);
  // datele au câmpuri *_en (rezerva e româna). Ce ajunge în Cereri B2C rămâne în română.
  const UI = { lang: document.documentElement.lang === 'en' ? 'en' : 'ro' };
  const L = (ro, en) => (UI.lang === 'en' ? en : ro);
  const pick = (ro, en) => (UI.lang === 'en' && en ? en : ro);
  function withLang(lang, fn) { const prev = UI.lang; UI.lang = lang; try { return fn(); } finally { UI.lang = prev; } }
  const uiSave = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* fără stocare locală */ } };
  function applyStatic() {
    const en = UI.lang === 'en';
    document.querySelectorAll('[data-en]').forEach(el => { if (el.dataset.ro == null) el.dataset.ro = el.innerHTML; el.innerHTML = en ? el.dataset.en : el.dataset.ro; });
    document.querySelectorAll('[data-en-ph]').forEach(el => { if (el.dataset.roPh == null) el.dataset.roPh = el.getAttribute('placeholder') || ''; el.setAttribute('placeholder', en ? el.dataset.enPh : el.dataset.roPh); });
    document.querySelectorAll('[data-en-aria]').forEach(el => { if (el.dataset.roAria == null) el.dataset.roAria = el.getAttribute('aria-label') || ''; el.setAttribute('aria-label', en ? el.dataset.enAria : el.dataset.roAria); });
    $('ui-lang-' + UI.lang).checked = true;
  }
  const tx = k => pick(D.texte[k], (D.texte_en || {})[k]);
  const sNume = s => pick(s.nume, s.nume_en);
  const sDesc = s => pick(s.descriere, s.descriere_en);
  const kmOf = m => L(m.km, String(m.km).replace(/(\d)\.(\d{3})/g, '$1,$2'));
  const motOf = m => pick(m.motorizare, m.motorizare_en);
  const termOf = m => pick(m.termen, m.termen_en);
  const mentOf = m => pick(m.mentiune, m.mentiune_en);

  const group3 = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, L('.', ','));
  const eur = n => '€ ' + group3(n);
  const gross = net => Math.round(net * (1 + D.tva));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const keyOf = m => m.marca + ' ' + m.model;
  const verLabel = m => m.versiune + (m.baterie && !/kwh/i.test(m.versiune) ? ' ' + m.baterie : '');
  const carLabel = m => keyOf(m) + ' ' + verLabel(m);
  const stareLabel = s => (s === 'nou' ? L('nouă', 'new') : L('rulată', 'used'));

  // modele, în ordinea prețului de pornire (cel mai ieftin primul)
  const MODELS = [];
  D.masini.forEach(m => { if (!MODELS.includes(keyOf(m))) MODELS.push(keyOf(m)); });
  const minNet = k => Math.min.apply(null, D.masini.filter(m => keyOf(m) === k).map(m => m.pret));
  MODELS.sort((a, b) => minNet(a) - minNet(b));

  // ---------- stare ----------
  const S = {
    mode: 'catalog',
    model: MODELS[0],
    stare: 'nou',
    cod: null,
    war: (WAR.find(s => s.implicit) || WAR[WAR.length - 1] || {}).cod,
    extra: new Set(OTHER.filter(s => s.implicit).map(s => s.cod)),
    sent: false
  };

  // ---------- 3. calcul ----------
  function svcNet() {
    let t = 0;
    const w = WAR.find(s => s.cod === S.war);
    if (w) t += w.pret;
    OTHER.forEach(s => { if (S.extra.has(s.cod)) t += s.pret; });
    return t;
  }
  function svcNames() {
    const out = [];
    OTHER.forEach(s => { if (S.extra.has(s.cod) && s.cod === 'omol') out.push(sNume(s)); });
    const w = WAR.find(s => s.cod === S.war);
    if (w) out.push(w.pret ? L('Pachet ' + sNume(w), sNume(w) + ' package') : sNume(w));
    OTHER.forEach(s => { if (S.extra.has(s.cod) && s.cod !== 'omol') out.push(sNume(s)); });
    return out;
  }
  // B2B: toate sumele sunt fără TVA; reducerea se aplică doar prețului mașinii
  function priceOf(m) {
    const disc = Math.round(m.pret * RED);
    const carNet = m.pret - disc;
    const svc = svcNet();
    const net = carNet + svc;
    return { list: m.pret, disc: disc, carNet: carNet, svc: svc, net: net, gross: gross(net) };
  }
  const pct = () => Math.round(RED * 100) + '%';
  const car = () => D.masini.find(m => m.cod === S.cod) || null;
  const carsFor = (k, st) => D.masini.filter(m => keyOf(m) === k && m.stare === st);

  // ---------- 4. interfață ----------
  function fillStatic() {
    $('t-eticheta').textContent = tx('eticheta');
    $('t-titlu').textContent = tx('titlu');
    $('t-intro').textContent = tx('intro');
    $('t-alta').textContent = tx('alta_masina');
    const g = $('t-gdpr');
    g.textContent = tx('gdpr') + ' ';
    if (D.contact.gdprLink) {
      const a = document.createElement('a');
      a.href = D.contact.gdprLink; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = L('Politica de confidențialitate', 'Privacy policy');
      g.appendChild(a);
    }
    $('contact').innerHTML = L('Ai întrebări? Sună-ne', 'Questions? Call us') + '<b>' + esc(D.contact.telefon) + '</b>' +
      (D.contact.email ? '<span>' + L('sau scrie la ', 'or write to ') + '<b>' + esc(D.contact.email) + '</b></span>' : '');
    $('foot').textContent = tx('subsol') + L(' Prețuri actualizate la ', ' Prices updated on ') + D.generat + '.';

    $('svc-war').innerHTML = WAR.map(s =>
      '<label class="svc-row"><input type="radio" name="war" value="' + esc(s.cod) + '">' +
      '<span class="svc-name">' + esc(sNume(s)) + '</span>' +
      '<span class="svc-price">' + (s.pret ? '+' + eur(s.pret) : '—') + '</span>' +
      '<span class="svc-desc">' + esc(sDesc(s)) + '</span></label>').join('');
    $('svc-other').innerHTML = OTHER.map(s =>
      '<label class="svc-row"><input type="checkbox" name="extra" value="' + esc(s.cod) + '">' +
      '<span class="svc-name">' + esc(sNume(s)) + tipBtn(sDesc(s)) + '</span>' +
      '<span class="svc-price">+' + eur(s.pret) + '</span></label>').join('');
    $('tip-war').innerHTML = tipBtn(L('DEFEND Car Protect DELUXE: 3 ani, km nelimitați, fără franșiză, până la 40.000 RON per eveniment, bateria inclusă.', 'DEFEND Car Protect DELUXE: 3 years, unlimited km, no excess, up to RON 40,000 per claim, battery included.'));
    document.querySelectorAll('input[name="war"]').forEach(i => { i.checked = i.value === S.war; });
    document.querySelectorAll('input[name="extra"]').forEach(i => { i.checked = S.extra.has(i.value); });
  }

  function pickDefaultCar() {
    const list = carsFor(S.model, S.stare);
    if (!list.some(m => m.cod === S.cod)) S.cod = list.length ? list[0].cod : null;
  }

  function renderModels() {
    $('models').innerHTML = MODELS.map(k => {
      const from = Math.min.apply(null, D.masini.filter(m => keyOf(m) === k).map(m => priceOf(m).net));
      return '<label class="opt"><input type="radio" name="model" value="' + esc(k) + '"' + (k === S.model ? ' checked' : '') + '>' +
        '<span class="box"><span class="model-name">' + esc(k) + '</span>' +
        '<span class="model-from">' + L('de la ', 'from ') + '<b>' + eur(from) + '</b>' + L(' fără TVA', ' excl. VAT') + '</span></span></label>';
    }).join('');
  }

  function renderStare() {
    ['nou', 'rulat'].forEach(st => {
      const el = $('stare-' + st);
      el.disabled = carsFor(S.model, st).length === 0;
      el.checked = S.stare === st;
    });
    $('tip-stare').innerHTML = S.stare === 'nou' ? '' : tipBtn(tx('nota_rulat'));   // la rulate nota stă în butonul (i)
    const sn = $('stare-note');   // la mașini noi nota anti-dumping stă la vedere (decizie 11.11): e argumentul pentru rulate
    sn.textContent = S.stare === 'nou' ? tx('nota_antidumping') : '';
    sn.hidden = !sn.textContent;
  }

  function renderVersions() {
    const list = carsFor(S.model, S.stare);
    $('versions').innerHTML = list.map(m => {
      const p = priceOf(m);
      const meta = [m.baterie && !/kwh/i.test(m.versiune) ? m.baterie : '', motOf(m), kmOf(m), m.an]
        .filter(Boolean).join(' · ') + (termOf(m) ? L(' · livrare în aproximativ ', ' · delivery in about ') + termOf(m) : '');
      return '<label class="opt ver"><input type="radio" name="ver" value="' + esc(m.cod) + '"' + (m.cod === S.cod ? ' checked' : '') + '>' +
        '<span class="box"><span class="ver-name">' + esc(m.versiune) +
        (m.mentiune ? '<span class="chip">' + esc(mentOf(m)) + '</span>' : '') + '</span>' +
        '<span class="ver-price">' + eur(p.net) + '<small>' + L('fără TVA', 'excl. VAT') + '</small></span>' +
        '<span class="ver-meta">' + esc(meta) + '</span></span></label>';
    }).join('') || '<p class="hint-text">' + L('Momentan nu avem versiuni în această stare.', 'We currently have no versions in this condition.') + '</p>';
  }

  function renderPanel() {
    const notes = [];
    if (S.mode === 'other') {
      $('p-car').textContent = L('Altă mașină', 'Another car');
      $('p-body').innerHTML =
        '<div class="big wait"><span>' + L('Preț', 'Price') + '</span><b>' + L('Estimare la cerere', 'Estimate on request') + '</b>' +
        '<small>' + L('Un consultant BADSI caută mașina pe piața din China și revine cu prețul livrat în București.', 'A BADSI consultant looks for the car on the Chinese market and gets back to you with the price delivered in Bucharest.') + '</small></div>';
      notes.push(tx('nota_livrare'));
      $('mb-label').textContent = L('Altă mașină', 'Another car');
      $('mb-price').textContent = L('Estimare la cerere', 'Estimate on request');
    } else {
      const m = car();
      if (!m) {
        $('p-car').textContent = L('Alegeți o versiune.', 'Choose a version.');
        $('p-body').innerHTML = '';
        $('mb-price').textContent = '—';
      } else {
        const p = priceOf(m);
        const n = qty();
        $('p-car').innerHTML = esc(carLabel(m)) + '<span>' + esc(L('Mașină ' + stareLabel(m.stare) + ', ' + kmOf(m), (m.stare === 'nou' ? 'New' : 'Used') + ' car, ' + kmOf(m))) + '</span>';
        let html = '<div class="blk">' +
          '<div class="ln"><span>' + L('Mașina (preț de listă)', 'Car (list price)') + '</span><span class="v">' + eur(p.list) + '</span></div>' +
          (p.disc ? '<div class="ln"><span>' + L('Reducere B2B ', 'B2B discount ') + pct() + '</span><span class="v">−' + eur(p.disc) + '</span></div>' : '') +
          '<div class="ln"><span>' + L('Servicii BADSI', 'BADSI services') + '<span class="d">' + esc(svcNames().join(', ') || L('niciunul', 'none')) + '</span></span><span class="v">' + (p.svc ? '+' + eur(p.svc) : eur(0)) + '</span></div>' +

    nr: { el: $('f-nr'), wrap: $('fw-nr'), err: $('e-nr'), ok: v => { const x = Number(v); return Number.isInteger(x) && x >= 1 && x <= 999; } },
    nume: { el: $('f-nume'), wrap: $('fw-nume'), err: $('e-nume'), ok: v => v.trim().length >= 3 },
    tel: { el: $('f-tel'), wrap: $('fw-tel'), err: $('e-tel'), ok: v => v.replace(/\D/g, '').length >= 9 },

  // CUI → numele firmei de la ANAF, prin scriptul din Cereri B2B (merge pe GitHub; în artefactul claude.ai e blocat și se completează de mână)
  let anafFor = '';
  async function lookupCui() {
    const cui = cuiDigits($('f-cui').value);
    const msg = $('anaf-msg');
    if (!cui || cui === anafFor || !D.endpoint) return;
    anafFor = cui;
    msg.className = ''; msg.textContent = L('Se caută firma la ANAF…', 'Looking up the company at ANAF…');
    try {
      const res = await fetch(D.endpoint + '?cui=' + encodeURIComponent(cui), { signal: AbortSignal.timeout ? AbortSignal.timeout(30000) : undefined });
      const r = await res.json();
      if (cuiDigits($('f-cui').value) !== cui) return;
      if (r && r.ok && r.gasit) {
        if (!$('f-firma').value.trim()) { $('f-firma').value = r.denumire; $('f-firma').dispatchEvent(new Event('input')); }
        msg.textContent = L('Găsit la ANAF: ', 'Found at ANAF: ') + r.denumire + (r.platitorTva ? L(' (plătitor de TVA)', ' (VAT registered)') : '');
      } else if (r && r.ok) {
        msg.className = 'err'; msg.textContent = L('CUI-ul nu apare la ANAF. Verificați-l.', 'This tax ID is not listed at ANAF. Please check it.');
      } else { msg.textContent = ''; anafFor = ''; }
    } catch (e) { msg.textContent = ''; anafFor = ''; }
  }

  function validate() {
    let first = null;
    const bad = (wrap, err, isBad, el) => {
      wrap.classList.toggle('is-bad', isBad);

      if (isBad && !first) first = el;
    };
    if (S.mode === 'other') bad($('fw-desc'), $('e-desc'), $('o-desc').value.trim().length < 3, $('o-desc'));
    activeFields().forEach(k => { const f = fields[k]; bad(f.wrap, f.err, !f.ok(f.el.value), f.el); });
    bad($('fw-gdpr'), null, !$('f-gdpr').checked, $('f-gdpr'));
    return first;
  }

  // ---------- oferta PDF: centralizatorul cererii (poze, mașina, servicii, prețuri, note) ----------
  // Se face în browserul clientului (html2canvas + jsPDF de pe cdnjs), în limba aleasă, din configurația de la trimitere.
  // În claude.ai descărcarea trece prin capabilitatea „downloads”; pe GitHub e o descărcare obișnuită.
  // Poze: randările oficiale din configuratorul Zeekr (../zeekr/img pe GitHub); unde nu se încarcă, PDF-ul iese fără ele.
  const PDF_LIBS = [
    'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'
  ];
  const PDF_IMG = { '9x': ['9x-phantom', '9x-int-moonglade'], '8x': ['8x-red', '8x-int-brown'] };
  const PDF_VIEWS = [['v2', 'Profil', 'Side'], ['v3', 'Spate', 'Rear'], ['v4', 'Frontal', 'Head-on'], ['int', 'Interior', 'Cabin']];
  let libsP = null;
  function loadLibs() {
    if (!libsP) {
      libsP = Promise.all(PDF_LIBS.map(src => new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = res;
        s.onerror = () => rej(new Error('pdf-libs'));
        document.head.appendChild(s);
      }))).catch(e => { libsP = null; throw e; });
    }
    return libsP;
  }
  let dlNs = null;
  if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(ns => { dlNs = ns; }, () => { dlNs = null; });
  const pad2 = n => String(n).padStart(2, '0');

  // serviciile alese, în ordinea din panou (omologare, garanție, restul)
  function svcItems() {
    const out = [];
    const w = WAR.find(s => s.cod === S.war);
    OTHER.forEach(s => { if (S.extra.has(s.cod) && s.cod === 'omol') out.push(s); });
    if (w) out.push(w);
    OTHER.forEach(s => { if (S.extra.has(s.cod) && s.cod !== 'omol') out.push(s); });
    return out;
  }

  let offer = null;   // cererea din momentul trimiterii
  function snapOffer(nr, sent) {
    const now = new Date();
    offer = {
      mode: S.mode, m: S.mode === 'other' ? null : car(), svcs: S.mode === 'other' ? [] : svcItems(), nr: nr || null, sent: !!sent,
      date: pad2(now.getDate()) + '.' + pad2(now.getMonth() + 1) + '.' + now.getFullYear(),
      desc: $('o-desc').value.trim(), link: $('o-link').value.trim(),

    };
  }

  function pdfBlocks(o) {
    const m = o.m;
    const img = (src, cls) => `<img src="${esc(src)}" alt=""${cls ? ` class="${cls}"` : ''}>`;
    const row = (title, desc, amt) => `<div class="pdf-row no-img"><div><b>${esc(title)}</b>${desc ? `<p>${esc(desc)}</p>` : ''}</div><span class="pdf-amt">${amt}</span></div>`;
    const head = t => `<p class="pdf-h">${esc(t)}</p>`;
    const kv = rows => '<dl class="pdf-kv">' + rows.filter(x => x[1]).map(x => `<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join('') + '</dl>';
    const B = [];
    const title = m ? keyOf(m) : L('Altă mașină', 'Another car');
    B.push(`<div class="pdf-band"><img class="pdf-logo" src="${(document.querySelector('.wordmark-img') || {}).src || ''}" alt="BADSI"><span class="pdf-band-r">${L('OFERTĂ ESTIMATIVĂ', 'ESTIMATED OFFER')}<br>`
      + (o.nr ? `<b>${L('Cererea nr. ', 'Request no. ')}${esc(o.nr)}</b><br>` : '') + `${esc(o.date)}</span></div>`
      + `<h1 class="pdf-title">${esc(title.toUpperCase())}</h1>`
      + (m ? `<p class="pdf-sub">${esc(verLabel(m))} · ${esc(stareLabel(m.stare))} · ${esc(kmOf(m))}</p>` : ''));

    const set = m && PDF_IMG[String(m.model).toLowerCase()];
    if (set) {
      const base = '../zeekr/img/';
      B.push(img(base + set[0] + '-v1.jpg', 'pdf-hero')
        + `<div class="pdf-thumbs">${PDF_VIEWS.map(v => `<figure>${img(base + (v[0] === 'int' ? set[1] + '-hq' : set[0] + '-' + v[0]) + '.jpg')}<figcaption>${L(v[1], v[2])}</figcaption></figure>`).join('')}</div>`
        + `<p class="pdf-cap">${L('Imagini de prezentare; culorile și dotările se stabilesc împreună cu consultantul BADSI.', 'Presentation images; colours and equipment are agreed with your BADSI consultant.')}</p>`);
    }

    const carRows = m ? [
      ['Model', keyOf(m)], [L('Versiune', 'Version'), m.versiune], [L('Baterie', 'Battery'), m.baterie], [L('Motorizare', 'Powertrain'), motOf(m)],
      [L('Stare', 'Condition'), stareLabel(m.stare)], [L('Kilometraj', 'Mileage'), kmOf(m)], [L('An', 'Year'), m.an],
      [L('Livrare', 'Delivery'), termOf(m) ? L('aprox. ', 'approx. ') + termOf(m) : L('de confirmat', 'to be confirmed')]
    ] : [[L('Caut', 'Looking for'), o.desc], [L('Anunț', 'Listing'), o.link]];
    B.push(`<div class="pdf-2col"><div>${head(L('Client', 'Client'))}${kv(pdfClientRows(o))}</div><div>${head(L('Mașina', 'Car'))}${kv(carRows)}</div></div>`);

    if (m) {
      const sTitle = s => (s.tip === 'garanție' ? L('Garanție BADSI ', 'BADSI warranty ') + sNume(s) : sNume(s));
      if (o.svcs.length) o.svcs.forEach((s, i) => B.push((i ? '' : head(L('Servicii BADSI', 'BADSI services'))) + row(sTitle(s), sDesc(s), s.pret ? '+ ' + eur(s.pret) : eur(0))));
      else B.push(head(L('Servicii BADSI', 'BADSI services')) + `<p class="pdf-sub">${L('Niciun serviciu ales.', 'No services selected.')}</p>`);
      const svc = o.svcs.reduce((a, s) => a + s.pret, 0);
      const tr = (a, b, cls) => `<tr${cls ? ` class="${cls}"` : ''}><td>${esc(a)}</td><td>${esc(b)}</td></tr>`;
      B.push(head(L('Preț', 'Price')) + `<table class="pdf-tot">${pdfPriceRows(o, m, svc, tr)}</table>`);
    } else {
      B.push(head(L('Preț', 'Price')) + `<p class="pdf-sub">${L('Un consultant BADSI caută mașina pe piața din China și revine cu prețul livrat în București.', 'A BADSI consultant looks for the car on the Chinese market and gets back to you with the price delivered in Bucharest.')}</p>`);
    }

    if (m && o.client.msg) B.push(head(L('Mesajul dumneavoastră', 'Your message')) + `<p class="pdf-msg">${esc(o.client.msg)}</p>`);
    const notes = (m ? ['nota_livrare', 'nota_estimare', m.stare === 'nou' ? 'nota_antidumping' : 'nota_rulat', 'subsol'] : ['nota_livrare', 'subsol']).map(tx).filter(Boolean);
    B.push(head(L('De reținut', 'Good to know')) + '<div class="pdf-notes">' + notes.map(t => '<p>' + esc(t) + '</p>').join('')
      + `<p><b>BADSI Automotive</b> · ${esc(D.contact.email)} · ${esc(D.contact.telefon)}</p></div>`);
    // pachetul de garanție apare ca insignă colorată (PLATINUM / GOLD / SILVER)
    return B.map(h => h.replace(/<b>((?:Garanție BADSI|BADSI warranty) )(PLATINUM|GOLD|SILVER)<\/b>/g, (m, a, t) => '<b>' + a + '<span class="pdf-tier t-' + t.toLowerCase() + '">' + t + '</span></b>'));
  }

  async function makePdf(o) {
    await loadLibs();
    const root = $('pdf-root');
    root.innerHTML = pdfBlocks(o).map(h => '<div class="pdf-blk">' + h + '</div>').join('');
    const wait = (p, ms) => Promise.race([p, new Promise(res => setTimeout(res, ms))]);
    await wait(Promise.all([...root.querySelectorAll('img')].map(i => (i.complete ? 0 : new Promise(res => { i.onload = res; i.onerror = res; })))), 8000);
    // poze care nu s-au încărcat (ex. în claude.ai): fără ele; fără poza mare, scoatem tot blocul de poze
    root.querySelectorAll('img').forEach(i => { if (!i.naturalWidth) { if (i.classList.contains('pdf-hero')) i.closest('.pdf-blk').remove(); else if (i.isConnected) i.closest('figure') ? i.closest('figure').remove() : i.remove(); } });
    if (document.fonts && document.fonts.ready) await wait(document.fonts.ready, 3000);
    try {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
      const M = 12, W = 210 - 2 * M, BOTTOM = 297 - 14;
      let y = M;
      for (const el of [...root.children]) {
        const c = await window.html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false, windowWidth: 760 });
        const h = c.height * W / c.width;
        if (y + h > BOTTOM && y > M) { pdf.addPage(); y = M; }
        pdf.addImage(c.toDataURL('image/jpeg', 0.88), 'JPEG', M, y, W, h);
        y += h + 2;
      }
      const n = pdf.getNumberOfPages();
      pdf.setFont('helvetica', 'normal');
      pdf.setFontSize(8);
      pdf.setTextColor(130);
      for (let i = 1; i <= n; i++) {
        pdf.setPage(i);
        pdf.text('BADSI Automotive  |  ' + D.contact.email + '  |  ' + D.contact.telefon, M, 297 - 7);
        pdf.text(i + ' / ' + n, 210 - M, 297 - 7, { align: 'right' });
      }
      pdf.setProperties({ title: L('Ofertă BADSI', 'BADSI offer') + (o.m ? ' - ' + keyOf(o.m) : ''), author: 'BADSI Automotive' });
      return pdf.output('blob');
    } finally {
      root.innerHTML = '';
    }
  }

  async function saveBlob(blob, name) {
    if (dlNs) {
      try { await dlNs.save({ filename: name, data: blob }); return 'ok'; } catch (e) { if (e && e.code === 'declined') return 'declined'; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    return 'ok';
  }

      + '<div class="row-actions"><button class="btn ghost" type="button" id="btn-pdf">' + L('Descărcați oferta (PDF)', 'Download the offer (PDF)') + '</button>'
      + '<span class="msg" id="pdf-msg" aria-live="polite"></span></div>';
    $('btn-pdf').addEventListener('click', downloadOffer);
  }

  let pdfBusy = false;
  async function downloadOffer() {
    if (!offer || pdfBusy) return;
    pdfBusy = true;
    const say = (t, bad) => { const el = $('pdf-msg'); if (el) { el.className = 'msg' + (bad ? ' is-error' : ''); el.textContent = t; } };
    const btn = $('btn-pdf');
    if (btn) btn.disabled = true;
    say(L('Se pregătește oferta PDF…', 'Preparing the PDF offer…'));
    try {
      const name = (L('Oferta BADSI', 'BADSI offer') + ' - ' + (offer.m ? carLabel(offer.m) : L('alta masina', 'another car')) + (offer.nr ? ' - ' + L('cererea ', 'request ') + offer.nr : '') + ' - ' + offer.client.nume)
        .replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim() + '.pdf';
      const res = await saveBlob(await makePdf(offer), name);
      say(res === 'declined' ? L('Ați renunțat la descărcare. O puteți descărca oricând din butonul de mai sus.', 'You cancelled the download. You can download it any time with the button above.')
        : L('Oferta PDF a fost descărcată.', 'The PDF offer has been downloaded.'));
    } catch (e) {
      say(L('Nu am putut genera PDF-ul. Încercați din nou.', 'We could not generate the PDF. Please try again.'), true);
    } finally {
      pdfBusy = false;
      const b = $('btn-pdf');
      if (b) b.disabled = false;
    }
  }

  let doneNr = null;
  function renderDone() {
    $('done').innerHTML = '<b>' + esc(tx('confirmare')) + '</b>' + (doneNr ? '<p>' + L('Numărul cererii: ', 'Request number: ') + '<strong>' + esc(doneNr) + '</strong></p>' : '');
  }
  function showDone(nr) {
    S.sent = true;
    doneNr = nr || null;
    $('send-msg').textContent = '';
    $('form').hidden = true;
    $('done').hidden = false;
    renderDone();
    renderPanel();
    $('done').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  // după trimitere: oferta PDF pleacă pe EMAIL (scriptul Google o salvează în Drive și o trimite clientului, cu copie la echipă).
  // Descărcarea rămâne doar rezervă: cererea n-a plecat (ex. artefactul claude.ai), scriptul e vechi (fără cheie) sau emailul n-a mers.
  function finishOffer(nr, sent, r) {
    snapOffer(nr, sent);
    offer.id = (r && r.id) || null;
    offer.cheie = (r && r.cheie) || null;
    offer.mail = sent && offer.cheie ? 'pending' : null;
    renderOfferBox();
    if (offer.mail) { emailOffer(); return; }
    if (!sent) $('manual').scrollIntoView({ behavior: 'smooth', block: 'center' });
    downloadOffer();
  }
  const b64Of = blob => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = () => rej(fr.error); fr.readAsDataURL(blob); });
  async function emailOffer() {
    try {
      const pdf = await b64Of(await makePdf(offer));
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 90000);
      const res = await fetch(D.endpoint, { method: 'POST', body: JSON.stringify({ actiune: 'pdf', id: offer.id, cheie: offer.cheie, lang: UI.lang, pdf }), signal: ctl.signal });
      clearTimeout(timer);
      const r = await res.json();
      if (!r || !r.ok) throw new Error((r && r.error) || 'raspuns');
      offer.mail = 'ok';
      offer.link = r.link || '';
    } catch (e) {
      offer.mail = 'fail';
    }
    renderOfferBox();
  }

  async function send() {
    if (S.sent) { $('done').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    if (S.mode === 'catalog' && !car()) { $('versions').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    const first = validate();
    if (first) {
      $('send-msg').textContent = L('Completați câmpurile marcate.', 'Fill in the marked fields.');
      $('send-msg').className = 'msg is-error';
      first.scrollIntoView({ behavior: 'smooth', block: 'center' });
      first.focus({ preventScroll: true });
      return;
    }
    $('send-msg').textContent = '';
    $('send-msg').className = 'msg';
    const d = withLang('ro', payload);   // în Cereri B2B totul rămâne în română; limba clientului se vede la „sursa”
    if (UI.lang === 'en') d.sursa += ' · EN';
    if (!D.endpoint) { finishOffer(null, false); return; }
    // trimiterea se face doar din butonul panoului (și din bara de jos pe telefon)
    const btns = [$('btn-panel'), $('mb-btn')];
    btns.forEach(b => { b.disabled = true; b.textContent = L('Se trimite…', 'Sending…'); });
    // scriptul Google poate răspunde greu la primul apel (s-a văzut ~20 s): clientul vede că se lucrează
    $('send-msg').textContent = L('Se trimite cererea; poate dura până la 30 de secunde.', 'Sending your request; it can take up to 30 seconds.');
    $('send-msg').className = 'msg';
    let reached = false;   // false = cererea n-a plecat deloc (ex. pagina e un artefact claude.ai, unde trimiterea e blocată)
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 60000);   // 60 s: altfel o cerere ajunsă în sheet putea apărea ca netrimisă
      const res = await fetch(D.endpoint, { method: 'POST', body: JSON.stringify(d), signal: ctl.signal });
      clearTimeout(timer);
      reached = true;
      const r = await res.json();
      if (r && r.ok) { showDone(r.id || r.nr); finishOffer(r.id || r.nr, true, r); return; }
      if (r && r.error === 'email') { fields.email.wrap.classList.add('is-bad'); fields.email.err.hidden = false; $('send-msg').textContent = L('Verificați adresa de email.', 'Check the email address.'); $('send-msg').className = 'msg is-error'; return; }
      throw new Error((r && r.error) || 'raspuns');
    } catch (err) {
      $('send-msg').textContent = '';
      finishOffer(null, false);
    } finally {
      btns.forEach(b => { b.disabled = false; });
      renderPanel();   // pune la loc eticheta butoanelor („Trimite cererea” / „Cerere trimisă”)
    }
  }

  $('form').addEventListener('submit', e => { e.preventDefault(); send(); });
  $('btn-panel').addEventListener('click', send);
  $('mb-btn').addEventListener('click', send);   // pe telefon: același buton; dacă lipsesc date, duce la primul câmp necompletat
  $('f-nr').addEventListener('input', () => renderPanel());
  $('f-cui').addEventListener('change', lookupCui);
  $('f-cui').addEventListener('blur', lookupCui);
  Object.keys(fields).forEach(k => fields[k].el.addEventListener('input', () => {
    if (fields[k].wrap.classList.contains('is-bad') && fields[k].ok(fields[k].el.value)) { fields[k].wrap.classList.remove('is-bad'); fields[k].err.hidden = true; }
  }));
  $('f-gdpr').addEventListener('change', () => { if ($('f-gdpr').checked) $('fw-gdpr').classList.remove('is-bad'); });
  $('o-desc').addEventListener('input', () => { if ($('o-desc').value.trim().length >= 3) { $('fw-desc').classList.remove('is-bad'); $('e-desc').hidden = true; } });

  // ---------- 6. bara BADSI: limba și tema ----------
  function setLang(lang) {
    UI.lang = lang === 'en' ? 'en' : 'ro';
    document.documentElement.lang = UI.lang;
    uiSave('badsi-ui-lang', UI.lang);
    applyStatic();
    renderPfNote();
    fillStatic();
    renderAll();
    if (S.sent) renderDone();
    if (offer) renderOfferBox();
    if ($('send-msg').textContent) $('send-msg').textContent = '';
  }
  function setScheme(dark) {
    if (dark) document.documentElement.setAttribute('data-scheme', 'dark');
    else document.documentElement.removeAttribute('data-scheme');
    $('ui-theme').setAttribute('aria-pressed', dark ? 'true' : 'false');
    uiSave('badsi-ui-theme', dark ? 'dark' : 'light');
  }
  document.querySelectorAll('input[name="ui-lang"]').forEach(i => i.addEventListener('change', () => { if (i.checked) setLang(i.value); }));
  $('ui-theme').addEventListener('click', () => setScheme(document.documentElement.getAttribute('data-scheme') !== 'dark'));
  $('ui-theme').setAttribute('aria-pressed', document.documentElement.getAttribute('data-scheme') === 'dark' ? 'true' : 'false');

  applyStatic();
  renderPfNote();
  fillStatic();
  renderAll();
})();
</script>
</body></html>
